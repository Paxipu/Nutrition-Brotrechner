[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brotrechner"
version = "5.1.0"
description = "Nutrition, cost and baker's percentage calculator for home-baked bread (EU 1169/2011 compliant labels)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Martin Kraus" }]
keywords = ["bread", "baking", "nutrition", "bakers-percentage", "food-labelling", "eu-1169-2011"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Natural Language :: German",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "PySide6>=6.5,<7",
    # Untergrenze aus Sicherheitsgründen: Pillow-Versionen vor 12.3 haben
    # zahlreiche bekannte Schwachstellen beim Einlesen von Bilddateien
    # (pip-audit meldet 29 Einträge für 9.2). Der Code selbst kommt mit 9.2
    # aus, die Anforderung ist bewusst strenger.
    "Pillow>=12.3",
]

[project.optional-dependencies]
pdf = ["reportlab>=4.0"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    # Obergrenzen sind hier kein Selbstzweck: ruff nimmt in jeder Nebenversion
    # neue Regeln in Betrieb. Ohne Deckel zieht die CI eine neuere Fassung als
    # der Entwicklungsrechner und meldet Verstöße gegen Regeln, die es lokal
    # noch gar nicht gab.
    "ruff>=0.15,<0.17",
    "mypy>=1.10,<3",
    "pip-audit>=2.7",
    "reportlab>=4.0",
]

[project.urls]
Homepage = "https://github.com/Paxipu/Nutrition-Brotrechner"
Issues = "https://github.com/Paxipu/Nutrition-Brotrechner/issues"
Changelog = "https://github.com/Paxipu/Nutrition-Brotrechner/blob/main/CHANGELOG.md"

[project.scripts]
brotrechner = "brotrechner.cli:main"

[project.gui-scripts]
brotrechner-gui = "brotrechner.cli:main_gui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brotrechner = ["data/seed/*.json", "gui/icons/*", "py.typed"]

# ── Tooling ────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "SIM",       # simplify
    "PTH",       # use pathlib
    "RUF",       # ruff-specific
    "ARG",       # unused arguments
    "TRY",       # exception anti-patterns
    "PL",        # pylint subset
]
ignore = [
    "PLR0913",  # many arguments - unavoidable for nutrient records
    "PLR2004",  # magic value comparison - noisy for numeric domain code
    "TRY003",   # long messages inside raise - we prefer readable errors
    "RUF001",   # "ambiguous" unicode: x and non-breaking spaces are deliberate German typography
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Fixtures, die nur wegen ihrer Nebenwirkung angefordert werden (etwa das
# isolierte Datenverzeichnis), sehen für den Linter wie ungenutzte Argumente aus.
"tests/*" = ["PLR0915", "PLC0415", "ARG002", "SLF001"]
# Qt's model/view API dictates these shapes: data()/headerData() dispatch on role
# with many returns, and QModelIndex() as a default argument is the documented
# signature. Dialog constructors legitimately assemble many widgets.
"src/brotrechner/gui/**" = ["PLR0911", "PLR0915", "B008"]
# Der Generator lebt von seiner Tabellenform: Die Kurzfunktion n() nimmt ihre
# Nährwerte bewusst positional entgegen, sonst bläht sich die Tabelle mit 107
# Einträgen auf ein Vielfaches auf. Als Regelausnahme statt als noqa-Kommentar,
# weil PLR0917 je nach ruff-Version stabil oder Vorschau ist - ein Kommentar
# wäre in der einen Fassung nötig und in der anderen selbst ein Verstoß.
"tools/build_seed_database.py" = ["PLR0917"]
# Der Doppelklick-Starter importiert bewusst spät und breit: Er soll auch dann
# noch eine lesbare Meldung zeigen, wenn eine Abhängigkeit fehlt - genau dann
# wäre ein Import am Dateikopf schon gescheitert.
"Brotrechner starten.pyw" = ["PLC0415", "BLE001"]

[tool.ruff.lint.pylint]
max-branches = 15
max-statements = 60

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
mypy_path = "src"
packages = ["brotrechner"]

[[tool.mypy.overrides]]
module = ["reportlab.*", "PIL.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "gui: tests that need a Qt application instance",
]
filterwarnings = ["error::DeprecationWarning:brotrechner.*"]

[tool.coverage.run]
branch = true
source = ["src/brotrechner"]
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@overload",
]
