name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Von Hand startbar, etwa für einen Zweig ohne Pull Request.
  workflow_dispatch:
  schedule:
    # Wöchentlich, damit neu bekannt gewordene Schwachstellen in Abhängigkeiten
    # auffallen, auch wenn niemand etwas ändert.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Qualitätstore (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux mit jeder unterstützten Version. Windows - dort startet das
        # Programm meist per Doppelklick - und macOS mit der ältesten und der
        # neuesten.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Qt braucht unter Linux auch ohne Bildschirm ein paar Systembibliotheken,
      # damit sich PySide6 überhaupt importieren lässt.
      - name: Qt-Systembibliotheken
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libdbus-1-3

      - name: Abhängigkeiten
        run: pip install -e ".[dev]"

      # Die Schwachstellenprüfung hängt nicht vom Betriebssystem ab - einmal genügt.
      - name: Qualitätstore
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python tools/quality_gate.py
          ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && '--audit' || '' }}

      - name: Startdatenbank unverändert?
        run: git diff --exit-code -- src/brotrechner/data/seed/ingredients.json
