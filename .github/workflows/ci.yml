name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Wöchentlich, damit neu bekannt gewordene Schwachstellen in Abhängigkeiten
    # auffallen, auch wenn niemand etwas ändert.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Qualitätstore (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Qt braucht auch ohne Bildschirm ein paar Systembibliotheken, damit sich
      # PySide6 überhaupt importieren lässt.
      - name: Qt-Systembibliotheken
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libdbus-1-3

      - name: Abhängigkeiten
        run: pip install -e ".[dev]"

      - name: Qualitätstore
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/quality_gate.py --audit

      - name: Startdatenbank unverändert?
        run: git diff --exit-code -- src/brotrechner/data/seed/ingredients.json
