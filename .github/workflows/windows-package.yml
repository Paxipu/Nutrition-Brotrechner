name: Windows-Paket

# Baut Brotrechner.exe samt Kommandozeile als Ordner und prüft das fertige
# Paket, bevor es hochgeladen wird. Bei einem Versions-Tag (v5.2.0) hängt der
# Lauf das Paket an das Release dieses Tags.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Paket bauen und prüfen
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Abhängigkeiten
        run: pip install ".[pdf]" -r packaging/requirements.txt

      - name: Version
        id: version
        run: |
          $version = python -c "import brotrechner; print(brotrechner.__version__)"
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            Write-Error "Tag $env:GITHUB_REF_NAME passt nicht zur Programmversion $version"
            exit 1
          }

      # Baut dist/Brotrechner und prüft das fertige Paket: Kommandozeile mit
      # Selbsttest, Qt-Plugin, Start der Oberfläche. Dasselbe Skript läuft in
      # der CI bei jedem Pull Request.
      - name: Paket bauen und prüfen
        run: ./packaging/build_windows.ps1

      - name: Zip
        run: |
          $zip = "Brotrechner-${{ steps.version.outputs.version }}-windows.zip"
          Compress-Archive -Path dist/Brotrechner -DestinationPath $zip

      - uses: actions/upload-artifact@v4
        with:
          name: Brotrechner-${{ steps.version.outputs.version }}-windows
          path: Brotrechner-*-windows.zip
          if-no-files-found: error

      - name: An das Release hängen
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "Brotrechner-${{ steps.version.outputs.version }}-windows.zip"
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $zip --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $zip --generate-notes
          }
